<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Drona L — Associate Consultant at KPMG. Portfolio featuring Multi-Agent Systems, Google ADK, RAG, Knowledge Graphs, and Full-Stack Engineering." />
  <title>Drona's - Portfolio</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <!-- Font Awesome Icons -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Minimal Mistakes Layout Stylesheet -->
  <link rel="stylesheet" href="./styles.css?v=2" />

  <!-- Marked.js for full GitHub-Flavored Markdown (GFM) parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
  <!-- Reading Progress Bar (visible when reading a blog post) -->
  <div class="reading-progress-bar" id="reading-progress-bar"></div>
  <!-- ========================================================================
       Top Masthead Navigation (Minimal Mistakes .masthead)
       ======================================================================== -->
  <header class="masthead">
    <div class="masthead__inner-wrap">
      <a href="#about" class="site-title" id="site-title-link">
        <span id="masthead-name">Drona L</span>
      </a>

      <nav class="greedy-nav" aria-label="Primary Navigation">
        <ul class="visible-links" id="nav-links">
          <li class="masthead__menu-item"><a href="#about" data-section="about" class="active">About</a></li>
          <li class="masthead__menu-item"><a href="#experience" data-section="experience">Experience</a></li>
          <li class="masthead__menu-item"><a href="#projects" data-section="projects">Projects</a></li>
          <li class="masthead__menu-item"><a href="#blogs" data-section="blogs">Blogs</a></li>
          <li class="masthead__menu-item"><a href="#cv" data-section="cv">CV</a></li>
          <li class="masthead__menu-item"><a href="#education" data-section="education">Education</a></li>
          <li class="masthead__menu-item"><a href="#certifications" data-section="certifications">Certifications</a></li>
        </ul>

        <div class="masthead__actions">
          <button class="icon-btn" id="search-toggle" title="Search Portfolio (Ctrl+K)" aria-label="Open Search">
            <i class="fas fa-search"></i>
          </button>
          <button class="icon-btn" id="theme-toggle" title="Toggle Contrast / Dark Skin" aria-label="Toggle Theme">
            <i class="fas fa-moon"></i>
          </button>
          <button class="icon-btn nav-toggle" id="nav-toggle" aria-label="Toggle Navigation Menu">
            <i class="fas fa-bars"></i>
          </button>
        </div>
      </nav>
    </div>
  </header>

  <!-- ========================================================================
       Main 3-Column Minimal Mistakes Layout (#main)
       ======================================================================== -->
  <div id="main" role="main">
    <!-- Left Sidebar: Persistent Author Profile (author_profile: true) -->
    <aside class="sidebar" aria-label="Author Profile">
      <div class="author__avatar">
        <img id="author-avatar" src="./assets/profile.webp" alt="Drona L" />
      </div>

      <div class="author__content">
        <h3 class="author__name" id="author-name">Drona L</h3>
        <div class="author__role" id="author-role">Associate Consultant @ KPMG</div>
        <p class="author__bio" id="author-bio"></p>
      </div>

      <div class="author__urls-wrapper">
        <button class="btn--follow" id="follow-toggle" aria-expanded="false">
          <i class="fas fa-user-plus"></i> Follow
        </button>
        <ul class="author__urls" id="author-urls">
          <!-- Populated dynamically from metadata.json -->
        </ul>
      </div>
    </aside>

    <!-- Center Column: Active Page Layout (single / archive / grid) -->
    <article class="page" id="page-article">
      <nav class="breadcrumbs" aria-label="Breadcrumb">
        <ol id="breadcrumbs-list">
          <li><a href="#about">Home</a></li>
          <li class="sep">/</li>
          <li class="current" id="breadcrumb-current">About</li>
        </ol>
      </nav>

      <header class="page__header">
        <h1 class="page__title" id="page-title">About Me</h1>
        <p class="page__lead" id="page-lead"></p>
      </header>

      <section class="page__content" id="page-content">
        <!-- Active view rendered dynamically -->
      </section>
    </article>

    <!-- Right Sidebar: Sticky Table of Contents (toc: true) -->
    <aside class="sidebar__right" id="toc-sidebar" aria-label="On This Page">
      <nav class="toc">
        <h4 class="nav__title">
          <i class="fas fa-file-alt"></i> On This Page
        </h4>
        <ul class="toc__menu" id="toc-menu">
          <!-- Populated dynamically based on h2/h3 in #page-content -->
        </ul>
      </nav>
    </aside>
  </div>

  <!-- ========================================================================
       Instant Search Modal (Minimal Mistakes layout: search)
       ======================================================================== -->
  <div class="search-modal" id="search-modal" role="dialog" aria-modal="true" aria-label="Search Portfolio">
    <div class="search-modal__box">
      <div class="search-modal__header">
        <i class="fas fa-search" style="color: var(--text-muted)"></i>
        <input type="text" class="search-modal__input" id="search-input"
          placeholder="Search experience, projects, blogs, skills, or certifications..." autocomplete="off" />
        <button class="icon-btn" id="search-close" aria-label="Close Search">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="search-modal__results" id="search-results"></div>
    </div>
  </div>

  <!-- ========================================================================
       Footer (Minimal Mistakes .page__footer)
       ======================================================================== -->
  <footer class="page__footer">
    <div class="page__footer-inner">
      <div>
        <span>&copy; 2026 All rights reserved.</span>
      </div>
      <ul class="page__footer-follow" id="footer-links">
        <!-- Populated dynamically -->
      </ul>
    </div>
  </footer>

  <!-- ========================================================================
       Application Logic (Minimal Mistakes Router, Renderer, TOC & Search)
       ======================================================================== -->
  <script>
    let portfolioData = null;
    let activeSection = 'about';
    let activeBlogId = null;
    let activeProjectFilter = 'All';
    let activeBlogCategory = 'All';
    let blogSearchQuery = '';
    let currentBlogPage = 1;
    const BLOGS_PER_PAGE = 5;
    const blogMarkdownCache = {};
    let cvDisplayMode = 'digital'; // 'digital' or 'pdf'

    const SECTION_META = {
      about: {
        title: 'About Me',
        lead: 'Associate Consultant & AI Engineer specializing in Agentic AI, Multi-Agent Systems, RAG, and Full-Stack Development.'
      },
      experience: {
        title: 'Professional Experience',
        lead: 'Building production-ready Agentic AI, RAG pipelines, and Enterprise automation solutions at KPMG.'
      },
      projects: {
        title: 'Projects Archive',
        lead: 'Featured Major Projects and specialized Mini Projects across Agentic AI, Google ADK, RAG, Deep Learning, and Full-Stack Web.'
      },
      blogs: {
        title: 'Blogs & Articles',
        lead: 'Deep dives on Google ADK, Citation-Backed RAG, Knowledge Graphs, MCP Servers, and Enterprise QA Orchestration.'
      },
      cv: {
        title: 'Curriculum Vitae (Digital & PDF)',
        lead: 'View my complete interactive digital resume below, print a formatted copy, or download the original PDF.'
      },
      education: {
        title: 'Education',
        lead: 'Academic background in Artificial Intelligence & Machine Learning.'
      },
      certifications: {
        title: 'Certifications & Specializations',
        lead: 'Professional training and credentials across Cloud AI, Full-Stack Engineering, and Enterprise Automation.'
      }
    };

    document.addEventListener('DOMContentLoaded', async () => {
      initTheme();
      initMobileToggles();
      initSearchModal();

      try {
        const res = await fetch('./metadata.json');
        portfolioData = await res.json();

        // Load standalone blogs index from blogs/index.json
        try {
          const blogsUrl = portfolioData.blogsIndex || './blogs/index.json';
          const blogsRes = await fetch(blogsUrl);
          portfolioData.blogs = blogsRes.ok ? await blogsRes.json() : [];
        } catch (blogErr) {
          console.warn('Could not load blogs/index.json:', blogErr);
          portfolioData.blogs = portfolioData.blogs || [];
        }

        renderAuthorSidebar(portfolioData.about, portfolioData.socialMedia, portfolioData.site);
        renderFooterLinks(portfolioData.socialMedia);
        handleRouteChange();
        window.addEventListener('hashchange', handleRouteChange);
      } catch (err) {
        console.error('Failed to load metadata.json:', err);
        document.getElementById('page-content').innerHTML =
          '<p>Unable to load portfolio data. Please check metadata.json.</p>';
      }
    });

    /* ========================================================================
       Author Profile Sidebar & Social Media Tags
       ======================================================================== */
    function renderAuthorSidebar(about, social, site) {
      document.getElementById('masthead-name').textContent = about.name;
      document.getElementById('author-name').textContent = about.name;
      document.getElementById('author-role').textContent = about.headline || about.title;
      document.getElementById('author-bio').textContent = about.shortBio || about.description;

      const avatar = document.getElementById('author-avatar');
      avatar.src = about.profilePhoto;
      avatar.onerror = () => {
        avatar.src = about.profilePhotoFallback || './assets/profile.png';
      };

      const urlsList = document.getElementById('author-urls');
      const items = [
        { icon: 'fas fa-fw fa-map-marker-alt', label: about.location, url: null },
        { icon: 'fas fa-fw fa-building', label: about.company, url: null },
        { divider: true },
        { icon: 'fas fa-fw fa-envelope', label: 'Email', url: social.email || `mailto:${about.email}` },
        { icon: 'fas fa-fw fa-phone', label: about.phone, url: social.phone || `tel:${about.phone}` },
        { icon: 'fab fa-fw fa-github', label: 'GitHub', url: social.github },
        { icon: 'fab fa-fw fa-linkedin', label: 'LinkedIn', url: social.linkedin },
        { icon: 'fab fa-fw fa-x-twitter', label: '.com', url: social.twitter },
        { icon: 'fab fa-fw fa-instagram', label: 'Instagram', url: social.instagram },
        { divider: true },
        {
          icon: 'fas fa-fw fa-file-pdf',
          label: 'Download CV (PDF)',
          url: (site && site.resumePdf) || './assets/Drona_L_Resume.pdf',
          download: 'Drona_L_Resume.pdf'
        }
      ];

      urlsList.innerHTML = items
        .map(item => {
          if (item.divider) {
            return '<li class="author__urls-divider" role="separator"></li>';
          }
          if (!item.url) {
            return `<li><i class="${item.icon}"></i><span>${item.label}</span></li>`;
          }
          const isExternal = item.url.startsWith('http');
          const attrs = isExternal
            ? 'target="_blank" rel="noopener noreferrer"'
            : item.download
            ? `download="${item.download}"`
            : '';
          return `
            <li>
              <a href="${item.url}" ${attrs}>
                <i class="${item.icon}"></i>
                <span>${item.label}</span>
              </a>
            </li>
          `;
        })
        .join('');
    }

    function renderFooterLinks(social) {
      const footerLinks = document.getElementById('footer-links');
      const links = [
        { label: 'GitHub', icon: 'fab fa-github', url: social.github },
        { label: 'LinkedIn', icon: 'fab fa-linkedin', url: social.linkedin },
        { label: '.com', icon: 'fab fa-x-twitter', url: social.twitter },
        { label: 'Instagram', icon: 'fab fa-instagram', url: social.instagram },
        { label: 'Email', icon: 'fas fa-envelope', url: social.email }
      ];
      footerLinks.innerHTML = links
        .filter(l => l.url)
        .map(
          l =>
            `<li><a href="${l.url}" target="_blank" rel="noopener noreferrer"><i class="${l.icon}"></i> ${l.label}</a></li>`
        )
        .join('');
    }

    /* ========================================================================
       Hash Router & Section Dispatcher
       ======================================================================== */
    function handleRouteChange() {
      if (!portfolioData) return;
      const rawHash = window.location.hash.replace(/^#\/?/, '') || 'about';

      // Support #blogs/slug or #projects/major-projects
      if (rawHash.startsWith('blogs/')) {
        activeSection = 'blogs';
        activeBlogId = rawHash.split('/')[1];
      } else if (rawHash === 'major-projects' || rawHash === 'mini-projects') {
        activeSection = 'projects';
        activeBlogId = null;
        setTimeout(() => {
          const target = document.getElementById(rawHash);
          if (target) target.scrollIntoView({ behavior: 'smooth' });
        }, 60);
      } else if (SECTION_META[rawHash]) {
        activeSection = rawHash;
        activeBlogId = null;
      } else {
        activeSection = 'about';
        activeBlogId = null;
      }

      // Update active state in Masthead Nav
      document.querySelectorAll('#nav-links a').forEach(link => {
        link.classList.toggle('active', link.dataset.section === activeSection);
      });

      // Close mobile nav if open
      document.getElementById('nav-links').classList.remove('open');

      renderActiveSection();
      if (rawHash !== 'major-projects' && rawHash !== 'mini-projects') {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function renderActiveSection() {
      const meta = SECTION_META[activeSection] || SECTION_META.about;
      document.getElementById('breadcrumb-current').textContent = meta.title;
      document.getElementById('page-title').textContent = meta.title;
      document.getElementById('page-lead').textContent = meta.lead;

      // Hide generic archive header when reading an individual blog article
      const pageHeader = document.querySelector('.page__header');
      if (pageHeader) {
        pageHeader.style.display = activeSection === 'blogs' && activeBlogId ? 'none' : '';
      }
      const progressBar = document.getElementById('reading-progress-bar');
      if (progressBar && !(activeSection === 'blogs' && activeBlogId)) {
        progressBar.style.width = '0%';
      }

      const container = document.getElementById('page-content');

      switch (activeSection) {
        case 'about':
          renderAboutView(container);
          break;
        case 'experience':
          renderExperienceView(container);
          break;
        case 'projects':
          renderProjectsView(container);
          break;
        case 'blogs':
          renderBlogsView(container);
          break;
        case 'cv':
          renderCVView(container);
          break;
        case 'education':
          renderEducationView(container);
          break;
        case 'certifications':
          renderCertificationsView(container);
          break;
        default:
          renderAboutView(container);
      }

      buildTableOfContents();
    }

    /* ========================================================================
       1) ABOUT VIEW (layout: single)
       ======================================================================== */
    function renderAboutView(container) {
      const { about, experience } = portfolioData;
      const latestRole = experience[0];

      const focusCardsHTML = (about.focusAreas || [])
        .map(
          area => `
          <div class="feature-card">
            <h3 class="feature-card__title" data-toc-skip="true">
              <i class="${area.icon}"></i> ${area.title}
            </h3>
            <p>${area.description}</p>
          </div>
        `
        )
        .join('');

      const skillsHTML = (about.skills || [])
        .map(
          group => `
          <div class="skill-group">
            <div class="skill-group__header">
              <i class="${group.icon}"></i> ${group.category}
            </div>
            <div class="tag-list">
              ${group.items.map(s => `<span class="page__taxonomy-item">${s}</span>`).join('')}
            </div>
          </div>
        `
        )
        .join('');

      container.innerHTML = `
        <h2 id="professional-summary"><i class="fas fa-user-tie"></i> Professional Summary</h2>
        <div class="notice--primary">
          <strong>Current Role:</strong> ${latestRole.title} at <strong>${latestRole.company}</strong> (${latestRole.duration}) &mdash; ${about.location}
        </div>
        <p>${about.description}</p>
        <div style="display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 1.75rem;">
          <a href="#experience" class="btn btn--primary"><i class="fas fa-briefcase"></i> View Experience</a>
          <a href="#projects" class="btn"><i class="fas fa-folder-open"></i> Explore Projects</a>
          <a href="#cv" class="btn"><i class="fas fa-id-card"></i> Interactive Digital CV</a>
          <a href="${portfolioData.site.resumePdf}" download="Drona_L_Resume.pdf" class="btn">
            <i class="fas fa-download"></i> Download Resume (PDF)
          </a>
        </div>

        <h2 id="core-focus-areas"><i class="fas fa-compass"></i> What I Do</h2>
        <div class="feature-grid">
          ${focusCardsHTML}
        </div>

        <h2 id="technical-skills"><i class="fas fa-laptop-code"></i> Technical Skills</h2>
        <div class="skills-matrix">
          ${skillsHTML}
        </div>
      `;
    }

    /* ========================================================================
       2) EXPERIENCE VIEW (layout: single)
       ======================================================================== */
    function renderExperienceView(container) {
      const roles = portfolioData.experience || [];
      container.innerHTML = `
        <h2 id="kpmg-career-progression"><i class="fas fa-briefcase"></i> Career Progression at KPMG</h2>
        <div class="experience-list">
          ${roles
            .map(
              role => `
            <div class="archive-card">
              <div class="archive-card__header">
                <div>
                  <h3 class="archive-card__title" id="${role.id}">${role.title}</h3>
                  <div class="archive-card__org">
                    <i class="fas fa-building"></i> ${role.company} &middot; ${role.location}
                  </div>
                </div>
                <span class="archive-card__meta">
                  <i class="far fa-calendar-alt"></i> ${role.duration}
                </span>
              </div>
              <ul class="archive-card__bullets">
                ${(role.highlights || []).map(b => `<li>${b}</li>`).join('')}
              </ul>
              <div class="tag-list">
                ${(role.skills || []).map(s => `<span class="page__taxonomy-item">${s}</span>`).join('')}
              </div>
            </div>
          `
            )
            .join('')}
        </div>
      `;
    }

    /* ========================================================================
       3) PROJECTS VIEW (Subsections: Major Projects & Mini Projects)
       ======================================================================== */
    function renderProjectsView(container) {
      const majorProjects = portfolioData.projects.major || [];
      const miniProjects = portfolioData.projects.mini || [];

      const filterCategories = ['All', 'Google ADK & Agents', 'RAG & AI/ML', 'Full-Stack & Web'];

      const matchesFilter = proj => {
        if (activeProjectFilter === 'All') return true;
        const text = `${proj.name} ${proj.description} ${(proj.techStack || []).join(' ')}`.toLowerCase();
        if (activeProjectFilter === 'Google ADK & Agents') {
          return text.includes('adk') || text.includes('agent') || text.includes('mcp');
        }
        if (activeProjectFilter === 'RAG & AI/ML') {
          return (
            text.includes('rag') ||
            text.includes('pytorch') ||
            text.includes('opencv') ||
            text.includes('machine learning') ||
            text.includes('scikit') ||
            text.includes('decision tree')
          );
        }
        if (activeProjectFilter === 'Full-Stack & Web') {
          return (
            text.includes('angular') ||
            text.includes('spring') ||
            text.includes('react') ||
            text.includes('java') ||
            text.includes('html') ||
            text.includes('javascript')
          );
        }
        return true;
      };

      const filteredMajor = majorProjects.filter(matchesFilter);
      const filteredMini = miniProjects.filter(matchesFilter);

      container.innerHTML = `
        <div class="filter-bar" role="toolbar" aria-label="Filter Projects">
          ${filterCategories
            .map(
              cat => `
            <button class="filter-btn ${activeProjectFilter === cat ? 'active' : ''}" data-filter="${cat}">
              ${cat}
            </button>
          `
            )
            .join('')}
        </div>

        <h2 id="major-projects">
          <i class="fas fa-star"></i> Major Projects (${filteredMajor.length})
        </h2>
        <p style="color: var(--text-muted); font-size: 0.92rem;">
          Flagship end-to-end systems featuring Agentic RAG, Multi-Modal Deep Learning, Multi-Agent Orchestration, and Full-Stack Architecture.
        </p>
        <div class="major-projects-list">
          ${filteredMajor
            .map(
              proj => `
            <div class="project-item--major">
              <div class="project-item__top">
                <div>
                  <h3 id="proj-${proj.id}" style="margin: 0;">${proj.name}</h3>
                  ${proj.subtitle ? `<div class="project-item__subtitle">${proj.subtitle}</div>` : ''}
                </div>
                <a href="${proj.githubLink}" target="_blank" rel="noopener noreferrer" class="btn">
                  <i class="fab fa-github"></i> View Repo
                </a>
              </div>
              <p style="font-size: 0.92rem; margin-bottom: 0.65rem;">${proj.description}</p>
              ${
                proj.highlights && proj.highlights.length
                  ? `<ul class="archive-card__bullets">
                      ${proj.highlights.map(h => `<li>${h}</li>`).join('')}
                    </ul>`
                  : ''
              }
              <div class="tag-list">
                ${(proj.techStack || []).map(t => `<span class="page__taxonomy-item">${t}</span>`).join('')}
              </div>
            </div>
          `
            )
            .join('')}
        </div>

        <h2 id="mini-projects">
          <i class="fas fa-th-large"></i> Mini Projects (${filteredMini.length})
        </h2>
        <p style="color: var(--text-muted); font-size: 0.92rem;">
          Focused agent implementations, MCP servers, computer vision modules, and ML utilities.
        </p>
        <div class="entries-grid">
          ${filteredMini
            .map(
              proj => `
            <div class="grid__item">
              <div>
                <h3>${proj.name}</h3>
                <p>${proj.description}</p>
              </div>
              <div>
                <div class="tag-list" style="margin-bottom: 0.85rem;">
                  ${(proj.techStack || []).map(t => `<span class="page__taxonomy-item">${t}</span>`).join('')}
                </div>
                <a href="${proj.githubLink}" target="_blank" rel="noopener noreferrer" class="btn" style="width: 100%; justify-content: center;">
                  <i class="fab fa-github"></i> Source Code
                </a>
              </div>
            </div>
          `
            )
            .join('')}
        </div>
      `;

      container.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeProjectFilter = btn.dataset.filter;
          renderProjectsView(container);
          buildTableOfContents();
        });
      });
    }

    /* ========================================================================
       4) BLOGS VIEW (GFM Markdown Reader, Tables, Progress Bar & Archive)
       ======================================================================== */
    function stripFrontMatter(mdText) {
      return mdText.replace(/^---\s*\r?\n[\s\S]*?\r?\n---\s*\r?\n?/, '').trim();
    }

    function formatInlineMarkdown(text) {
      return text
        .replace(/---/g, '&mdash;')
        .replace(/--/g, '&ndash;')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^*]+)\*/g, '<em>$1</em>');
    }

    function parseMarkdownToHTML(md) {
      let body = stripFrontMatter(md);

      // Only convert space-surrounded " --- " in prose to em-dash (never touch :--- or ---: in tables!)
      body = body.replace(/ --- /g, ' — ');

      let rawHtml = '';
      if (window.marked && typeof window.marked.parse === 'function') {
        rawHtml = window.marked.parse(body, { gfm: true, breaks: false });
      } else {
        // Multi-line aware GFM fallback parser (supports H1/H2/H3, tables, blockquotes, lists, paragraphs)
        const blocks = body.split(/\r?\n\s*\r?\n/);
        rawHtml = blocks
          .map(block => {
            const trimmed = block.trim();
            if (!trimmed) return '';
            if (trimmed.startsWith('```')) {
              const code = trimmed.replace(/^```\w*\r?\n?/, '').replace(/\r?\n?```$/, '');
              return `<pre><code>${code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>`;
            }
            if (/^-{3,}$/.test(trimmed)) return '<hr />';
            if (trimmed.startsWith('# ')) {
              const t = trimmed.replace(/^#\s+/, '');
              return `<h1>${formatInlineMarkdown(t)}</h1>`;
            }
            if (trimmed.startsWith('## ')) {
              const t = trimmed.replace(/^##\s+/, '');
              return `<h2>${formatInlineMarkdown(t)}</h2>`;
            }
            if (trimmed.startsWith('### ')) {
              const t = trimmed.replace(/^###\s+/, '');
              return `<h3>${formatInlineMarkdown(t)}</h3>`;
            }
            if (trimmed.startsWith('>')) {
              const quoteText = trimmed
                .split(/\r?\n/)
                .map(l => l.replace(/^>\s?/, ''))
                .join(' ');
              return `<blockquote><p>${formatInlineMarkdown(quoteText)}</p></blockquote>`;
            }
            // GFM Pipe Table
            if (trimmed.includes('|') && trimmed.split(/\r?\n/).length >= 2) {
              const rows = trimmed.split(/\r?\n/).map(r =>
                r
                  .trim()
                  .replace(/^\||\|$/g, '')
                  .split('|')
                  .map(c => c.trim())
              );
              if (rows.length >= 2 && rows[1].every(c => /^:?-{2,}:?$/.test(c))) {
                const headerCells = rows[0].map(c => `<th>${formatInlineMarkdown(c)}</th>`).join('');
                const bodyRows = rows
                  .slice(2)
                  .map(r => `<tr>${r.map(c => `<td>${formatInlineMarkdown(c)}</td>`).join('')}</tr>`)
                  .join('');
                return `<table><thead><tr>${headerCells}</tr></thead><tbody>${bodyRows}</tbody></table>`;
              }
            }
            // Unordered list
            if (/^[-*]\s+/m.test(trimmed)) {
              const items = trimmed
                .split(/\r?\n(?=[-*]\s+)/)
                .map(item => `<li>${formatInlineMarkdown(item.replace(/^[-*]\s+/, '').replace(/\r?\n\s*/g, ' '))}</li>`)
                .join('');
              return `<ul>${items}</ul>`;
            }
            // Ordered list
            if (/^\d+\.\s+/m.test(trimmed)) {
              const items = trimmed
                .split(/\r?\n(?=\d+\.\s+)/)
                .map(item => `<li>${formatInlineMarkdown(item.replace(/^\d+\.\s+/, '').replace(/\r?\n\s*/g, ' '))}</li>`)
                .join('');
              return `<ol>${items}</ol>`;
            }
            return `<p>${formatInlineMarkdown(trimmed.replace(/\r?\n/g, ' '))}</p>`;
          })
          .join('\n');
      }

      // Add heading IDs for TOC and open external links in new tab
      const temp = document.createElement('div');
      temp.innerHTML = rawHtml;

      temp.querySelectorAll('h2, h3').forEach((h, idx) => {
        const slug = h.textContent
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-|-$/g, '');
        h.id = slug || `article-heading-${idx}`;
      });

      temp.querySelectorAll('a').forEach(a => {
        const href = a.getAttribute('href') || '';
        if (href.startsWith('http')) {
          a.setAttribute('target', '_blank');
          a.setAttribute('rel', 'noopener noreferrer');
        }
      });

      return temp.innerHTML;
    }

    async function renderBlogsView(container) {
      const blogs = portfolioData.blogs || [];

      // Single Article Reader View (#blogs/<id>) — Exact GitHub / VS Code .markdown-body preview

        const post = blogs.find(b => b.id === activeBlogId);

          document.getElementById('breadcrumb-current').textContent = post.title;

              <p style="color: var(--text-muted);"><i class="fas fa-spinner fa-spin"></i> Loading markdown...</p>
            </article>

            let mdText = blogMarkdownCache[post.id];
            if (!mdText && post.file) {
              const mdRes = await fetch(`${post.file}?t=${Date.now()}`, { cache: 'no-store' });
              if (mdRes.ok) {
                mdText = await mdRes.text();
                blogMarkdownCache[post.id] = mdText;

            const bodyEl = document.getElementById('markdown-article-body');
            if (bodyEl) {
              bodyEl.innerHTML = mdText
                ? parseMarkdownToHTML(mdText)

            console.error('Error loading blog markdown:', err);

      // Archive View with Category Filter, Search & Pagination
      const categories = ['All', ...new Set(blogs.map(b => b.category).filter(Boolean))];

      const filteredBlogs = blogs.filter(post => {
        const matchesCat = activeBlogCategory === 'All' || post.category === activeBlogCategory;
        const q = blogSearchQuery.toLowerCase();
        const matchesQuery =
          !q ||
          post.title.toLowerCase().includes(q) ||
          (post.subtitle || '').toLowerCase().includes(q) ||
          (post.summary || '').toLowerCase().includes(q) ||
          (post.tags || []).some(t => t.toLowerCase().includes(q));

                    return `

    /* ========================================================================
       7) CERTIFICATIONS VIEW (Simple HTML / Badge Embed Loader)
       ======================================================================== */
    async function renderCertificationsView(container) {
      container.innerHTML = `
        <h2 id="professional-certifications"><i class="fas fa-certificate"></i> Certifications</h2>
        <div class="cert-embed-grid" id="cert-embed-container">
          <p style="color: var(--text-muted);"><i class="fas fa-spinner fa-spin"></i> Loading certifications...</p>
        </div>
      `;

      const embedBox = document.getElementById('cert-embed-container');
      try {
        const embedUrl = portfolioData.certificationsEmbedFile || './certifications/embeds.html';
        const res = await fetch(embedUrl, { cache: 'no-cache' });
        if (!res.ok) throw new Error('Failed to load embeds.html');
        let rawHtml = await res.text();

        // Normalize protocol-relative URLs (e.g. //cdn.credly.com -> https://cdn.credly.com)
        rawHtml = rawHtml.replace(/src=(["'])\/\//g, 'src=$1https://');

        embedBox.innerHTML = rawHtml;

        // Auto-wrap any bare Credly badge divs or iframes that aren't already inside .cert-embed-card
        embedBox.querySelectorAll('[data-share-badge-id], iframe').forEach(el => {
          if (!el.closest('.cert-embed-card')) {
            const wrapper = document.createElement('div');
            wrapper.className = 'cert-embed-card';
            el.parentNode.insertBefore(wrapper, el);
            wrapper.appendChild(el);
          }
        });

        // Re-create and execute unique <script> tags so Credly / external badge scripts run once per render
        const seenSrc = new Set();
        const scripts = Array.from(embedBox.querySelectorAll('script'));
        scripts.forEach(oldScript => {
          const src = oldScript.getAttribute('src');
          if (src) {
            if (seenSrc.has(src)) {
              oldScript.remove();
              return;
            }
            seenSrc.add(src);
          }
          const newScript = document.createElement('script');
          Array.from(oldScript.attributes).forEach(attr => {
            newScript.setAttribute(attr.name, attr.value);
          });
          if (oldScript.textContent) {
            newScript.textContent = oldScript.textContent;
          }
          oldScript.parentNode.replaceChild(newScript, oldScript);
        });

        buildTableOfContents();
      } catch (err) {
        console.error('Error loading certification embeds:', err);
        embedBox.innerHTML =
          '<p style="color: var(--text-muted);">Paste your certificate embed codes in <code>certifications/embeds.html</code>.</p>';
      }
    }

    /* ========================================================================
       Right Sticky Table of Contents Builder (Minimal Mistakes toc: true)
       ======================================================================== */
    function buildTableOfContents() {
      const tocMenu = document.getElementById('toc-menu');
      const tocSidebar = document.getElementById('toc-sidebar');
      const mainContainer = document.getElementById('main');
      const headings = Array.from(
        document.querySelectorAll('#page-content h2, #page-content h3:not([data-toc-skip="true"])')
      );

      if (headings.length === 0) {
        tocSidebar.style.display = 'none';
        mainContainer.classList.add('no-toc');
        return;
      }

      tocSidebar.style.display = '';
      mainContainer.classList.remove('no-toc');

      tocMenu.innerHTML = headings
        .map((h, i) => {
          if (!h.id) {
            h.id = `section-heading-${i}`;
          }
          const isH3 = h.tagName.toLowerCase() === 'h3';
          return `
            <li class="${isH3 ? 'toc-h3' : 'toc-h2'}">
              <a href="#${h.id}" data-target="${h.id}">${h.textContent.trim()}</a>
            </li>
          `;
        })
        .join('');

      tocMenu.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', e => {
          e.preventDefault();
          const targetEl = document.getElementById(link.dataset.target);
          if (targetEl) {
            targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
            tocMenu.querySelectorAll('a').forEach(a => a.classList.remove('active'));
            link.classList.add('active');
          }
        });
      });

      // Highlight first TOC item initially
      const firstLink = tocMenu.querySelector('a');
      if (firstLink) firstLink.classList.add('active');
    }

    window.addEventListener('scroll', () => {
      // Update reading progress bar if inside a blog article
      const progressBar = document.getElementById('reading-progress-bar');
      if (progressBar && activeSection === 'blogs' && activeBlogId) {
        const docHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const pct = docHeight > 0 ? Math.min(100, Math.max(0, (window.scrollY / docHeight) * 100)) : 0;
        progressBar.style.width = `${pct}%`;
      }

      const tocLinks = Array.from(document.querySelectorAll('#toc-menu a'));
      if (!tocLinks.length) return;

      let activeId = tocLinks[0].dataset.target;
      for (const link of tocLinks) {
        const el = document.getElementById(link.dataset.target);
        if (el) {
          const rect = el.getBoundingClientRect();
          if (rect.top <= 130) {
            activeId = link.dataset.target;
          }
        }
      }

      tocLinks.forEach(link => {
        link.classList.toggle('active', link.dataset.target === activeId);
      });
    });

      };

      openBtn.addEventListener('click', openSearch);
      closeBtn.addEventListener('click', closeSearch);
      modal.addEventListener('click', e => {
        if (e.target === modal) closeSearch();
      });

      document.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          openSearch();
        } else if (e.key === 'Escape' && modal.classList.contains('open')) {
          closeSearch();
        }
      });

      input.addEventListener('input', () => {
        renderSearchResults(input.value.trim().toLowerCase());
      });

      function renderSearchResults(query) {
        if (!portfolioData) return;
        const index = [];

        portfolioData.experience.forEach(exp => {
          index.push({
            title: `${exp.title} — ${exp.company}`,
            badge: 'Experience',
            desc: exp.highlights[0],
            hash: '#experience'
          });
        });

        portfolioData.projects.major.forEach(p => {
          index.push({
            title: p.name,
            badge: 'Major Project',
            desc: `${p.description} (${p.techStack.join(', ')})`,
            hash: '#major-projects'
          });
        });

        portfolioData.projects.mini.forEach(p => {
          index.push({
            title: p.name,
            badge: 'Mini Project',
            desc: `${p.description} (${p.techStack.join(', ')})`,
            hash: '#mini-projects'
          });
        });

        (portfolioData.blogs || []).forEach(b => {
          index.push({
            title: b.title,
            badge: 'Blog',
            desc: b.summary,
            hash: `#blogs/${b.id}`
          });
        });

        index.push({
          title: 'Certifications & Badges',
          badge: 'Certifications',
          desc: 'Embedded credentials and verification badges',
          hash: '#certifications'
        });

        const matches = query
          ? index.filter(
              item =>
                item.title.toLowerCase().includes(query) ||
                item.desc.toLowerCase().includes(query) ||
                item.badge.toLowerCase().includes(query)
            )
          : index.slice(0, 6);

        if (!matches.length) {
          resultsBox.innerHTML =
            '<p style="padding: 1rem; color: var(--text-muted); margin: 0;">No matching results found.</p>';
          return;
        }

        resultsBox.innerHTML = matches
          .map(
            m => `
          <a href="${m.hash}" class="search-result-item">
            <div class="search-result-item__title">
              <span>${m.title}</span>
              <span class="search-result-item__badge">${m.badge}</span>
            </div>
            <p class="search-result-item__desc">${m.desc}</p>
          </a>
        `
          )
          .join('');

        resultsBox.querySelectorAll('a').forEach(a => {
          a.addEventListener('click', () => {
            closeSearch();
          });
        });
      }
    }
  </script>
</body>

</html>
