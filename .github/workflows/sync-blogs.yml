name: Sync Markdown Blogs Index

on:
  push:
    branches: [main, master]
    paths:
      - "blogs/**/*.md"
      - "scripts/sync_blogs.py"

permissions:
  contents: write

jobs:
  sync-blogs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate blogs/index.json from blogs/*.md
        run: python3 scripts/sync_blogs.py

      - name: Commit updated blogs/index.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blogs/index.json
          git diff --staged --quiet || git commit -m "chore(blogs): auto-sync blogs/index.json from markdown files"
          git push
